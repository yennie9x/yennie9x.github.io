<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luyện lý thuyết lái xe</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f5;
      --card: #fff;
      --ink: #1c2b24;
      --muted: #5d6b64;
      --line: #d7e2db;
      --green: #1f7a4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { margin: 0 0 20px; color: var(--muted); }
    a {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      color: inherit;
      text-decoration: none;
    }
    a strong { display: block; margin-bottom: 4px; color: var(--green); }
  </style>
</head>
<body>
  <main>
    <h1>Luyện lý thuyết lái xe</h1>
    <p>Chọn bộ câu hỏi để bắt đầu.</p>
    <a href="lxb1/">
      <strong>20 câu đầu</strong>
      Câu 1–20, chia thành 2 bộ, mỗi bộ 10 câu.
    </a>
  </main>
</body>
</html>
